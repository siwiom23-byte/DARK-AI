
name: Build DARK AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract DARK AI project
        run: |
          unzip -q DARK_AI_Android_Starter.zip -d source
          ls -la source/DARK_AI_Android_Starter

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build DARK AI
        working-directory: source/DARK_AI_Android_Starter
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DARK-AI-APK
          path: source/DARK_AI_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
